name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks (links, files, JSON-LD, sitemap)
        run: python3 .github/checks/static.py
      - name: Install Chromium
        working-directory: .github/checks
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install chromium
      - name: Browser checks (errors, layout, corners, basket)
        run: node .github/checks/smoke.mjs screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
